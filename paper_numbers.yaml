# =====================================================================
#  Every number printed in the paper, with the table it is recomputed from.
#  scripts/verify_paper_numbers.py recomputes each one from results/tables/
#  (built by the notebooks or scripts/run_all.py) and fails on any mismatch.
#
#  Fields
#    id      unique identifier          desc   what the number is
#    value   exactly as printed         tol    half a unit in the last place
#    tex     where the paper prints it: line of the LaTeX source and the text
#    source  table under results/tables/
#    where   {column: value} row filter;  column, agg: how to reduce it
#    expr    instead of source: a formula over other claims, written {id}
#  Claims marked `printed: false` are intermediate values that a printed
#  claim is computed from.
# =====================================================================
