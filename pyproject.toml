[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokinv"
version = "1.0.0"
description = "Reproduction package and SI-Check auditor for 'Tokenisation Invariance' (anonymous submission)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.1", "numpy>=1.26,<2", "scipy>=1.11", "pyarrow>=14",
    "statsmodels>=0.14", "transformers==4.40.2", "tokenizers==0.19.1",
    "sentencepiece>=0.1.99", "protobuf", "PyYAML",
]

[project.optional-dependencies]
# scoring re-segmentations with COMET-family metrics (si-check score / run)
score = ["torch>=2.1", "unbabel-comet==2.2.6"]

[project.scripts]
si-check = "sicheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokinv = ["vendor/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
